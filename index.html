<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IS AI Directory Hub</title>
    <meta name="description" content="Discover free AI tools and Islamic resources in one place." />

    <!-- SEO: indexing + canonical -->
    <!-- Replace https://your-domain.com with your real, live domain everywhere
         it appears in this file (canonical, og:url, twitter, image URLs)
         once you know it, then update public/sitemap.xml and
         public/robots.txt to match. -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- SEO: Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IS AI Hub" />
    <meta property="og:title" content="IS AI Directory Hub" />
    <meta property="og:description" content="Discover free AI tools and Islamic resources in one place." />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/icon-512.png" />
    <meta property="og:locale" content="en_US" />

    <!-- SEO: Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IS AI Directory Hub" />
    <meta name="twitter:description" content="Discover free AI tools and Islamic resources in one place." />
    <meta name="twitter:image" content="https://your-domain.com/icon-512.png" />

    <!-- Google Search Console verification: paste the code Search Console
         gives you (Settings -> Ownership verification -> HTML tag) as the
         content value below, then uncomment this line. Leave it out of the
         page until you have the real value. -->
    <meta name="google-site-verification" content="Hcfz03N0ry2sDc048nN8DUmCkc9O6a7lLkiHrRgPIN0" />

    <!-- PWA: Theme & platform colors -->
    <meta name="theme-color" content="#0B6E4F" />
    <meta name="background-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA: Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA: iOS-specific "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IS AI Hub" />

    <!-- PWA: Windows tile support -->
    <meta name="msapplication-TileColor" content="#0B6E4F" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
